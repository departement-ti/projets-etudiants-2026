<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="navbar__container">

    <a class="navbar__brand" routerLink="/student/">
      <span class="navbar__brand-icon">M</span>
      <span class="navbar__brand-name">Tmazz Academy</span>
    </a>

    <ul class="navbar__links" [class.open]="isMenuOpen">
      <li>
        <a routerLink="/student/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Home</a>
      </li>

      <li>
        <a routerLink="/student/Cours" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Cours</a>
      </li>

      <li>
        <a routerLink="/student/Favorites" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Favorites</a>
      </li>

      <li>
        <a routerLink="/student/Chat" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Chat</a>
      </li>

      <li>
        <a routerLink="/student/Sertif" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Sertif</a>
      </li>

      <li>
        <a routerLink="/student/Profile" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Profile</a>
      </li>

      <li>
        <a routerLink="/student/Payment" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Payment</a>
      </li>

      <li class="navbar__cta-mobile">
        <button class="btn-cta" (click)="logout(); closeMenu()">Logout</button>
      </li>
    </ul>

    <div class="navbar__right">

      <div class="notif-wrapper">
        <button class="notif-btn" type="button" (click)="toggleNotifications()">
          🔔
          <span class="notif-badge" *ngIf="notifications.length > 0">
            {{ notifications.length }}
          </span>
        </button>

        <div class="notif-dropdown" *ngIf="showNotifications">
          <h4>Notifications</h4>

          <div class="notif-empty" *ngIf="notifications.length === 0">
            No notifications
          </div>

          <div class="notif-item" *ngFor="let n of notifications">
            <strong>{{ n.title }}</strong>
            <p>{{ n.message }}</p>
            <small>{{ n.createdAt | date:'short' }}</small>
          </div>
        </div>
      </div>

      <button class="btn-cta navbar__cta-desktop" (click)="logout(); closeMenu()">Logout</button>

      <button
        class="navbar__hamburger"
        [class.active]="isMenuOpen"
        (click)="toggleMenu()"
        aria-label="Toggle menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>

  </div>
</nav>

<div
  class="navbar__overlay"
  [class.visible]="isMenuOpen"
  (click)="closeMenu()"
></div>
