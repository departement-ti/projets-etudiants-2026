<div class="page-container">
  <div class="page-hero">
    <div>
      <p>Admin Panel</p>
      <h1>New Instructors</h1>
      <span>Pending instructor inscriptions</span>
    </div>
    <strong>{{ instructors.length }}</strong>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Lastname</th>
          <th>Email</th>
          <th>Tel</th>
          <th>Speciality</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let instructor of instructors">
          <td>{{ instructor.name }}</td>
          <td>{{ instructor.lastname }}</td>
          <td>{{ instructor.email }}</td>
          <td>{{ instructor.tel }}</td>
          <td>{{ instructor.speciality }}</td>
          <td>
            <button class="add-btn" (click)="openPopup(instructor)">
              ADD
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="empty" *ngIf="instructors.length === 0">
      No instructors found
    </div>
  </div>
</div>

<div class="popup-backdrop" *ngIf="showPopup">
  <div class="popup">
    <button type="button" class="close-btn" (click)="closePopup()">×</button>

    <h2>Accept Instructor</h2>

    <div class="form-group">
      <label>Name</label>
      <input type="text" [value]="selectedInstructor?.name" disabled />
    </div>

    <div class="form-group">
      <label>Lastname</label>
      <input type="text" [value]="selectedInstructor?.lastname" disabled />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="text" [value]="selectedInstructor?.email" disabled />
    </div>

    <div class="form-group">
      <label>Tel</label>
      <input type="text" [value]="selectedInstructor?.tel" disabled />
    </div>

    <div class="form-group">
      <label>Speciality</label>
      <input type="text" [value]="selectedInstructor?.speciality" disabled />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" placeholder="Enter password" />
    </div>

    <button
      class="accept-btn"
      (click)="acceptInstructor()"
      [disabled]="!password || isLoading"
    >
      {{ isLoading ? 'Accepting...' : 'Accept' }}
    </button>
  </div>
</div>
