<div class="page-container">
  <div class="page-hero">
    <div>
      <p>Members</p>
      <h1>Our Instructors</h1>
      <span>Manage accepted instructors</span>
    </div>
    <strong>{{ instructors.length }}</strong>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Lastname</th>
          <th>Email</th>
          <th>Tel</th>
          <th>Speciality</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let instructor of instructors">
          <td>{{ instructor.name }}</td>
          <td>{{ instructor.lastname }}</td>
          <td>{{ instructor.email }}</td>
          <td>{{ instructor.tel }}</td>
          <td>{{ instructor.speciality }}</td>

          <td class="actions">
            <button class="detail-btn" (click)="viewInstructor(instructor.id)">
              Detail
            </button>

            <button class="delete-btn" (click)="deleteInstructor(instructor.id)">
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="empty" *ngIf="instructors.length === 0">
      No instructors found
    </div>
  </div>
</div>
