<div class="login-container">
  <form>

    <div class="login-icon">
      <i class="ri-user-add-line"></i>
    </div>

    <h2>Create account</h2>
    <p class="login-subtitle">Choose your registration type</p>

    <button type="button" (click)="openPopup('student')">
      Student
    </button>

    <button type="button" class="secondary-btn" (click)="openPopup('instructor')">
      Instructor
    </button>

    <p *ngIf="successMessage && !showPopup" class="success">
      {{ successMessage }}
    </p>

  </form>
</div>

<div class="popup-backdrop" *ngIf="showPopup">
  <div class="popup">

    <button type="button" class="close-btn" (click)="closePopup()">×</button>

    <div class="login-icon">
      <i class="ri-user-line"></i>
    </div>

    <h2 *ngIf="selectedType === 'student'">Student inscription</h2>
    <h2 *ngIf="selectedType === 'instructor'">Instructor inscription</h2>

    <p class="login-subtitle">Fill your information</p>

    <form
      *ngIf="selectedType === 'student'"
      (ngSubmit)="submitStudent()"
      #studentForm="ngForm"
    >
      <div class="form-group">
        <label>Name</label>
        <input
          type="text"
          placeholder="Name"
          [(ngModel)]="student.name"
          name="studentName"
          required
        />
      </div>

      <div class="form-group">
        <label>Lastname</label>
        <input
          type="text"
          placeholder="Lastname"
          [(ngModel)]="student.lastname"
          name="studentLastname"
          required
        />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          placeholder="you@example.com"
          [(ngModel)]="student.email"
          name="studentEmail"
          required
          (ngModelChange)="checkEmailLive($event)"
        />

        <small *ngIf="emailChecking" class="field-info">
          Checking email...
        </small>

        <small *ngIf="emailExists" class="field-error">
          This email already exists
        </small>
      </div>

      <div class="form-group">
        <label>Tel</label>
        <input
          type="text"
          placeholder="12345678"
          [(ngModel)]="student.tel"
          name="studentTel"
          required
        />
      </div>

      <div class="form-group">
        <label>Payment Receipt Photo</label>

        <input
          type="file"
          accept="image/*"
          name="recuPaiement"
          required
          (change)="onReceiptSelected($event)"
        />

        <img
          *ngIf="receiptPreview"
          [src]="receiptPreview"
          class="receipt-preview"
          alt="Receipt preview"
        />

        <small *ngIf="!receiptFile" class="field-error">
          Receipt photo is required
        </small>
      </div>

      <button
        type="submit"
        [disabled]="studentForm.invalid || isLoading || emailExists || emailChecking || !receiptFile"
      >
        {{ isLoading ? 'Sending...' : 'Send inscription' }}
      </button>
    </form>

    <form
      *ngIf="selectedType === 'instructor'"
      (ngSubmit)="submitInstructor()"
      #instructorForm="ngForm"
    >
      <div class="form-group">
        <label>Name</label>
        <input
          type="text"
          placeholder="Name"
          [(ngModel)]="instructor.name"
          name="instructorName"
          required
        />
      </div>

      <div class="form-group">
        <label>Lastname</label>
        <input
          type="text"
          placeholder="Lastname"
          [(ngModel)]="instructor.lastname"
          name="instructorLastname"
          required
        />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          placeholder="you@example.com"
          [(ngModel)]="instructor.email"
          name="instructorEmail"
          required
          (ngModelChange)="checkEmailLive($event)"
        />

        <small *ngIf="emailChecking" class="field-info">
          Checking email...
        </small>

        <small *ngIf="emailExists" class="field-error">
          This email already exists
        </small>
      </div>

      <div class="form-group">
        <label>Tel</label>
        <input
          type="text"
          placeholder="12345678"
          [(ngModel)]="instructor.tel"
          name="instructorTel"
          required
        />
      </div>

      <div class="form-group">
        <label>Speciality</label>
        <input
          type="text"
          placeholder="Java Spring"
          [(ngModel)]="instructor.speciality"
          name="speciality"
          required
        />
      </div>

      <button
        type="submit"
        [disabled]="instructorForm.invalid || isLoading || emailExists || emailChecking"
      >
        {{ isLoading ? 'Sending...' : 'Send inscription' }}
      </button>
    </form>

  </div>
</div>
