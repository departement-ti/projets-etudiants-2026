<div class="dashboard-page">

  <h1>Instructor Dashboard 📊</h1>

  <div class="stats-grid">

    <div class="stat-card">
      <h2>{{ totalPassed }}</h2>
      <p>Students Passed Tests</p>
    </div>

  </div>

  <div class="chart-card">

    <h2>Passed Students Per Month</h2>

    <canvas
      baseChart
      [data]="lineChartData"
      [options]="lineChartOptions"
      [type]="'bar'"
    >
    </canvas>

  </div>

  <div class="table-card">

    <h2>Students Who Passed</h2>

    <table>

      <thead>
        <tr>
          <th>Student</th>
          <th>Course</th>
          <th>Score</th>
          <th>Date</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let r of passedStudents">

          <td>
            {{ r.student?.name }}
            {{ r.student?.lastname }}
          </td>

          <td>
            {{ r.cours?.titre }}
          </td>

          <td>
            {{ r.score }}/20
          </td>

          <td>
            {{ r.passedAt | date:'mediumDate' }}
          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>
